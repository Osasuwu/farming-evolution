plugins {
    id 'java-library'
    id 'net.neoforged.moddev' version '2.0.148'
}

version = mod_version
group = mod_group_id

base {
    archivesName = mod_id
}

repositories {
    mavenCentral()
    maven {
        name = 'Create'
        url = 'https://maven.createmod.net'
        content {
            includeGroup 'com.simibubi.create'
            includeGroup 'net.createmod.ponder'
            includeGroup 'dev.engine-room.flywheel'
        }
    }
    maven {
        name = 'Registrate'
        url = 'https://maven.ithundxr.dev/snapshots'
        content { includeGroup 'com.tterrag.registrate' }
    }
    maven {
        name = 'KubeJS'
        url = 'https://maven.latvian.dev/releases'
        content {
            includeGroup 'dev.latvian.mods'
            includeGroup 'dev.latvian.apps'
        }
    }
    maven {
        // A runtime library of KubeJS is published only here.
        name = 'JitPack'
        url = 'https://jitpack.io'
        content { includeGroup 'com.github.rtyley' }
    }
    maven {
        name = 'JEI'
        url = 'https://maven.blamejared.com/'
        content {
            includeGroup 'mezz.jei'
            // The config library of JEI's author, a dependency of JEI.
            includeGroup 'net.mezzdev.config'
        }
    }
}

java.toolchain.languageVersion = JavaLanguageVersion.of(21)

neoForge {
    version = project.neo_version

    parchment {
        mappingsVersion = project.parchment_mappings_version
        minecraftVersion = project.parchment_minecraft_version
    }

    runs {
        client {
            client()
            systemProperty 'neoforge.enabledGameTestNamespaces', project.mod_id
        }

        // Runs every registered GameTest on a headless server, then exits.
        // The exit code is the number of failed required tests.
        gameTestServer {
            type = "gameTestServer"
            gameDirectory = project.file('run/gametest')
            systemProperty 'neoforge.enabledGameTestNamespaces', project.mod_id
            // The mod writes the recipes of the started server here for checkRecipeGraph below.
            systemProperty 'farmingevolution.recipeGraphDump', project.file('run/gametest/recipe-graph-dump.json').absolutePath
            // Test data of the build: pack data some GameTests need and a player must not see.
            // Only this run adds it to the mod's pack data; it is not in the jar.
            systemProperty 'farmingevolution.gameTestPackData', project.file('src/gametest/pack.json').absolutePath
        }

        // Dedicated server used by the check pipeline: boots in its own directory,
        // receives "stop" on stdin and shuts down once startup is complete.
        smokeServer {
            server()
            gameDirectory = project.file('run/smoke')
            programArgument '--nogui'
        }

        // Client that pictures the slice and exits (issue #16; tasks at the end of this file).
        // The picture is taken by a mod of its own (source set screenshot), which only this run
        // gets, through the mods folder of its game directory: the mod jar never carries it.
        screenshot {
            client()
            gameDirectory = project.file('run/screenshot')
            systemProperty 'farmingevolution.screenshot', project.file('run/screenshot/screenshots/slice.png').absolutePath
            programArguments.addAll '--width', '1280', '--height', '720'
        }

        // Client an agent drives action by action (issue #74; tasks at the end of this file).
        // The same dev-only jar as the screenshot run; its control mod acts only on this property.
        control {
            client()
            gameDirectory = project.file('run/control')
            systemProperty 'farmingevolution.control.port', (project.findProperty('controlPort') ?: '25599').toString()
            systemProperty 'farmingevolution.control.screenshots', project.file('run/control/screenshots').absolutePath
            systemProperty 'farmingevolution.control.idleMinutes', (project.findProperty('controlIdleMinutes') ?: '30').toString()
            programArguments.addAll '--width', '1280', '--height', '720'
        }

        configureEach {
            logLevel = org.slf4j.event.Level.INFO
        }
    }

    mods {
        "${mod_id}" {
            sourceSet(sourceSets.main)
        }
    }
}

configurations {
    // The check helpers, run by the pipeline tasks below.
    checksRuntime {
        canBeConsumed = false
    }
    // Dev-only mods of the client runs alone, installed into their mods folders (clientModJars).
    // Not part of any classpath: a mod on the runtime classpath is loaded by every run.
    clientOnlyMods {
        canBeConsumed = false
    }
}

dependencies {
    checksRuntime project(':checks')

    // The inheritance engine is plain Java without mod metadata, so the dev runs load it
    // from the additional classpath and the mod jar carries its classes (see jar below).
    implementation project(':breeding')
    additionalRuntimeClasspath project(':breeding')

    // The pack's backbone mods, present in every run configuration of the dev environment.
    // The mod's code does not compile against them: GameTests reach Create through registries.
    // Coordinates: https://wiki.createmod.net/developers/depend-on-create/neoforge-1.21.1
    runtimeOnly("com.simibubi.create:create-${minecraft_version}:${create_version}:slim") { transitive = false }
    runtimeOnly "net.createmod.ponder:ponder-neoforge:${ponder_version}+mc${minecraft_version}"
    runtimeOnly "dev.engine-room.flywheel:flywheel-neoforge-${minecraft_version}:${flywheel_version}"
    runtimeOnly "com.tterrag.registrate:Registrate:${registrate_version}"
    // Coordinates: https://github.com/KubeJS-Mods/KubeJS/tree/2101#readme
    runtimeOnly "dev.latvian.mods:kubejs-neoforge:${kubejs_version}"
    // JEI (MIT), dev-only: recipes in runClient and runControl (issue #74). Not in the mod jar,
    // and the mod's code does not compile against it. Only the client runs get it (issue #76),
    // through the mods folders of their game directories (clientModJars below): the GameTest
    // server and the dedicated server of verify run without it, as a player's server does.
    // Coordinates: https://github.com/mezz/JustEnoughItems/wiki/Getting-Started-%5BMinecraft-1.21-and-1.21.1%5D
    clientOnlyMods "mezz.jei:jei-${minecraft_version}-neoforge:${jei_version}"
}

// The jars of the client-only mods that go into a mods folder. JEI's POM also brings its
// common, lib and gui jars and the config library's API, whose classes the two NeoForge jars
// already carry, so only the NeoForge jars of JEI and of its required mezz_config are taken;
// their versions are the ones JEI's POM names.
var clientModJarNames = ['jei-*-neoforge-*.jar', 'mezz_config-*-neoforge-*.jar']
var clientModJars = configurations.clientOnlyMods.asFileTree.matching { include clientModJarNames }

var generateModMetadata = tasks.register("generateModMetadata", ProcessResources) {
    var replaceProperties = [
            minecraft_version      : minecraft_version,
            minecraft_version_range: minecraft_version_range,
            neo_version            : neo_version,
            loader_version_range   : loader_version_range,
            mod_id                 : mod_id,
            mod_name               : mod_name,
            mod_license            : mod_license,
            mod_version            : mod_version,
    ]
    inputs.properties replaceProperties
    expand replaceProperties
    from "src/main/templates"
    into "build/generated/sources/modMetadata"
}
sourceSets.main.resources.srcDir generateModMetadata
neoForge.ideSyncTask generateModMetadata

// Placeholder blockstates, models and textures, drawn at build time.
apply from: 'gradle/stub-assets.gradle'

// ---------------------------------------------------------------------------
// Item textures from grey templates and palettes (issue #19; README.md, "Текстуры"). The
// generator (source set textures) reads src/textures/textures.json and writes a PNG and an item
// model per item into generated resources before processResources; the jar carries the output,
// not the generator. Its tests (source set texturesTest) are a stage of verify.
// ---------------------------------------------------------------------------

sourceSets {
    textures
    texturesTest {
        compileClasspath += sourceSets.textures.output
        runtimeClasspath += sourceSets.textures.output
    }
}
configurations {
    texturesTestImplementation.extendsFrom texturesImplementation
}
dependencies {
    texturesImplementation 'com.google.code.gson:gson:2.10.1'
    texturesTestImplementation platform('org.junit:junit-bom:5.11.4')
    texturesTestImplementation 'org.junit.jupiter:junit-jupiter'
    texturesTestRuntimeOnly 'org.junit.platform:junit-platform-launcher'
}

var texturesData = layout.projectDirectory.file('src/textures/textures.json')
var texturesDir = layout.buildDirectory.dir('generated/sources/textures')
var generateTextures = tasks.register('generateTextures', JavaExec) {
    group = 'build'
    description = 'Draws the item textures from grey templates and palettes and writes their item models.'
    classpath = sourceSets.textures.runtimeClasspath
    mainClass = 'io.github.osasuwu.farmingevolution.textures.TextureGenerator'
    inputs.file texturesData
    outputs.dir texturesDir
    args texturesData.asFile.absolutePath, texturesDir.get().asFile.absolutePath
}
sourceSets.main.resources.srcDir generateTextures
neoForge.ideSyncTask generateTextures

var texturesTest = tasks.register('texturesTest', Test) {
    group = 'verification'
    description = 'Tests the texture generator and finds its textures and models in the mod jar.'
    testClassesDirs = sourceSets.texturesTest.output.classesDirs
    classpath = sourceSets.texturesTest.runtimeClasspath
    useJUnitPlatform()
    var modJar = tasks.named('jar', Jar).flatMap { it.archiveFile }
    inputs.file modJar
    inputs.file texturesData
    systemProperty 'farmingevolution.textures', texturesData.asFile.absolutePath
    jvmArgumentProviders.add({ ["-Dfarmingevolution.modJar=${modJar.get().asFile.absolutePath}".toString()] } as CommandLineArgumentProvider)
    testLogging {
        events 'failed'
        exceptionFormat 'short'
        showStackTraces = false
    }
}

tasks.withType(JavaCompile).configureEach {
    options.encoding = 'UTF-8'
}

// One file to install: the mod jar carries the classes of the inheritance engine.
tasks.named('jar') {
    from { project(':breeding').sourceSets.main.output }
}

// ---------------------------------------------------------------------------
// The pack's KubeJS directory (scripts, data, assets, config) is kubejs/, tracked by git.
// KubeJS reads <game directory>/kubejs, and the game directories (run/) are not tracked,
// so every run first gets an exact copy: a script deleted from the repository does not
// survive in a run directory. KubeJS re-creates its own generated files on start.
// ---------------------------------------------------------------------------

[runClient: 'run', runGameTestServer: 'run/gametest', runSmokeServer: 'run/smoke', runScreenshot: 'run/screenshot'].each { runTask, gameDir ->
    var sync = tasks.register("syncKubeJsFor${runTask.capitalize()}", Sync) {
        from layout.projectDirectory.dir('kubejs')
        into layout.projectDirectory.dir("${gameDir}/kubejs")
    }
    tasks.named(runTask) { dependsOn sync }
}

// The client-only mods of runClient (see clientOnlyMods). Its game directory run/ is the
// author's, so the sync deletes only jars of the client-only mods it no longer installs
// (an older version after a bump) and keeps every other file in run/mods.
var installClientMods = tasks.register('installClientMods', Sync) {
    from clientModJars
    into layout.projectDirectory.dir('run/mods')
    preserve {
        include '**'
        exclude clientModJarNames
    }
}
tasks.named('runClient') { dependsOn installClientMods }

// ---------------------------------------------------------------------------
// Check pipeline. One command runs everything: gradlew verify
// ---------------------------------------------------------------------------

var smokeDir = layout.projectDirectory.dir('run/smoke')
var smokeLog = smokeDir.file('logs/latest.log')

// The dedicated server refuses to start until the Minecraft EULA is accepted.
// Acceptance is a person's decision, so the pipeline never writes eula=true itself.
var checkEula = tasks.register('checkEula') {
    group = 'verification'
    description = 'Fails with instructions when the Minecraft EULA is not accepted for the smoke server.'
    var eula = smokeDir.file('eula.txt').asFile
    doLast {
        // Read the way the server reads it: a properties file, value compared without case.
        var properties = new Properties()
        if (eula.isFile()) {
            eula.withInputStream { properties.load(it) }
        }
        if (!'true'.equalsIgnoreCase(properties.getProperty('eula', '').trim())) {
            throw new GradleException(
                    "Minecraft EULA is not accepted for the smoke server.\n" +
                    "Read https://aka.ms/MinecraftEULA and, if you agree, create ${eula} with the line: eula=true")
        }
    }
}

tasks.named('runSmokeServer') {
    dependsOn checkEula
    // "stop" is queued on the console and executed on the first server tick, i.e. after startup.
    standardInput = new ByteArrayInputStream('stop\n'.getBytes('UTF-8'))
    doFirst { smokeLog.asFile.delete() }
}

var scanSmokeLog = tasks.register('scanSmokeLog', JavaExec) {
    group = 'verification'
    description = 'Fails when the smoke server log shows a mod loading error or no completed startup.'
    dependsOn 'runSmokeServer'
    classpath = configurations.checksRuntime
    mainClass = 'io.github.osasuwu.farmingevolution.checks.ServerLogScan'
    args smokeLog.asFile.absolutePath
}

var checkTrackedFiles = tasks.register('checkTrackedFiles', JavaExec) {
    group = 'verification'
    description = 'Fails when git tracks build output or decompiled Minecraft sources.'
    classpath = configurations.checksRuntime
    mainClass = 'io.github.osasuwu.farmingevolution.checks.TrackedFilesCheck'
    workingDir = projectDir
}

var installGitHooks = tasks.register('installGitHooks', Exec) {
    group = 'verification'
    description = 'Points git at the hooks kept in .githooks.'
    commandLine 'git', 'config', 'core.hooksPath', '.githooks'
}

// Cheap checks first: a missing EULA or a forbidden file fails the command
// before the minutes-long first build, and the hook is installed even then.
checkEula.configure { mustRunAfter installGitHooks }
checkTrackedFiles.configure { mustRunAfter checkEula }
tasks.matching { it.name in ['createMinecraftArtifacts', 'compileJava', 'build', 'runGameTestServer'] }.configureEach {
    mustRunAfter checkEula, checkTrackedFiles
}
tasks.named('runSmokeServer') { mustRunAfter 'runGameTestServer' }

tasks.register('verify') {
    group = 'verification'
    description = 'The whole check pipeline: build, unit tests, GameTest, dedicated server boot with a log scan.'
    dependsOn installGitHooks, checkEula, checkTrackedFiles, 'build', ':checks:build', ':breeding:build', 'runGameTestServer', scanSmokeLog
}

// The breeding simulator (checks/build.gradle) is one more stage of the pipeline.
tasks.named('verify') { dependsOn ':checks:simulateBreeding' }

// The texture generator's tests (issue #19) are one more stage of the pipeline.
tasks.named('verify') { dependsOn texturesTest }

// The recipe graph stage: the GameTest server writes its recipes out on start (RecipeGraphDump
// in the mod), and the check fails when an input of a required recipe is out of reach of the
// starting resources of pack/recipe-graph.json.
var recipeGraphDump = layout.projectDirectory.file('run/gametest/recipe-graph-dump.json')
// A dump of an earlier run must not stand in for one this run did not write.
tasks.named('runGameTestServer') { doFirst { recipeGraphDump.asFile.delete() } }

// ---------------------------------------------------------------------------
// The place of the GameTest grid (issue #82). The game puts the grid of all GameTests at a
// random point of the world, so every run went in a random climate of the climate stub. A
// dev-only mod of the GameTest run alone puts the grid at the origin of the world instead
// (GameTestGridGameTests.GRID_ORIGIN; the mixin is in source set gametestGrid). Gradle puts
// its jar into run/gametest/mods only: the mod jar never carries it, and no other run gets it.
// ---------------------------------------------------------------------------

sourceSets {
    gametestGrid
}
neoForge.addModdingDependenciesTo(sourceSets.gametestGrid)
dependencies {
    // The place of the grid is a constant of its GameTest, in the mod.
    gametestGridImplementation sourceSets.main.output
}

var gametestGridJar = tasks.register('gametestGridJar', Jar) {
    description = 'The dev-only mod of the GameTest run that pins the place of the GameTest grid.'
    from sourceSets.gametestGrid.output
    archiveFileName = "${mod_id}-gametest-grid.jar"
    destinationDirectory = layout.buildDirectory.dir('gametestGrid')
}

var installGameTestGridMod = tasks.register('installGameTestGridMod', Sync) {
    from gametestGridJar
    into layout.projectDirectory.dir('run/gametest/mods')
}

tasks.named('runGameTestServer') {
    dependsOn installGameTestGridMod
    // At a fixed place, the blocks and entities an earlier run left there would meet the tests
    // of this run: every run starts in a new world, as it does in CI.
    doFirst { project.delete(layout.projectDirectory.dir('run/gametest/world')) }
}
var checkRecipeGraph = tasks.register('checkRecipeGraph', JavaExec) {
    group = 'verification'
    description = 'Fails when an input of a required recipe cannot be made from the starting resources.'
    dependsOn 'runGameTestServer'
    classpath = configurations.checksRuntime
    mainClass = 'io.github.osasuwu.farmingevolution.checks.RecipeGraphCheck'
    args recipeGraphDump.asFile.absolutePath, layout.projectDirectory.file('pack/recipe-graph.json').asFile.absolutePath
}
tasks.named('verify') { dependsOn checkRecipeGraph }

// ---------------------------------------------------------------------------
// Client screenshot (issue #16): gradlew runScreenshot starts the client with the mod, creates
// a flat world, builds the slice in it, takes the picture F2 takes and exits. The picture is
// run/screenshot/screenshots/slice.png. Not part of verify: the CI runner has no display.
// ---------------------------------------------------------------------------

sourceSets {
    screenshot
}
neoForge.addModdingDependenciesTo(sourceSets.screenshot)
dependencies {
    screenshotImplementation sourceSets.main.output
    screenshotImplementation project(':breeding')
    // The jei action of the client control reads JEI's item list through its API (issue #78).
    // Compile only: at run time JEI comes from the mods folder of the client runs.
    screenshotCompileOnly("mezz.jei:jei-${minecraft_version}-common-api:${jei_version}") { transitive = false }
}

var screenshotJar = tasks.register('screenshotJar', Jar) {
    description = 'The dev-only mod of the screenshot run.'
    from sourceSets.screenshot.output
    archiveFileName = "${mod_id}-screenshot.jar"
    destinationDirectory = layout.buildDirectory.dir('screenshot')
}

var installScreenshotMod = tasks.register('installScreenshotMod', Sync) {
    from screenshotJar
    from clientModJars
    into layout.projectDirectory.dir('run/screenshot/mods')
}

var screenshotPicture = layout.projectDirectory.file('run/screenshot/screenshots/slice.png')
tasks.named('runScreenshot') {
    group = 'verification'
    description = 'Starts the client, pictures the slice in a fresh flat world and exits; fails without the picture.'
    dependsOn installScreenshotMod
    // The mod gives up after 5 minutes; this catches a game that hangs before the mod runs.
    timeout = java.time.Duration.ofMinutes(10)
    doFirst {
        // A picture or world of an earlier run must not stand in for this one.
        screenshotPicture.asFile.delete()
        project.delete(layout.projectDirectory.dir('run/screenshot/saves/screenshot-slice'))
    }
    doLast {
        if (!screenshotPicture.asFile.isFile() || screenshotPicture.asFile.length() == 0) {
            throw new GradleException("The client exited without a picture at ${screenshotPicture.asFile}; see run/screenshot/logs/latest.log")
        }
        logger.lifecycle("Screenshot: ${screenshotPicture.asFile}")
    }
}

// The pipeline compiles the screenshot run, so it does not rot unseen; it does not start it.
tasks.named('verify') { dependsOn screenshotJar }

// ---------------------------------------------------------------------------
// Client control (issue #74): gradlew runControl starts the client in a fresh flat survival
// world and leaves it waiting for actions from tools/ClientControl.java on 127.0.0.1; each
// action answers with a picture and the new chat lines. How to use it: README.md,
// "Управление клиентом". The code is the control mod of the screenshot source set.
// ---------------------------------------------------------------------------

var installControlMod = tasks.register('installControlMod', Sync) {
    from screenshotJar
    from clientModJars
    into layout.projectDirectory.dir('run/control/mods')
}

var syncKubeJsForRunControl = tasks.register('syncKubeJsForRunControl', Sync) {
    from layout.projectDirectory.dir('kubejs')
    into layout.projectDirectory.dir('run/control/kubejs')
}

tasks.named('runControl') {
    group = 'verification'
    description = 'Starts the client in a fresh flat survival world, waiting for actions on 127.0.0.1 (README.md).'
    dependsOn installControlMod, syncKubeJsForRunControl
    // The mod closes the game after 30 idle minutes (-PcontrolIdleMinutes); this catches a game that hangs.
    timeout = java.time.Duration.ofHours(4)
    doFirst {
        // Every start is a fresh world, and no picture of an earlier run is mistaken for this one's.
        project.delete(layout.projectDirectory.dir('run/control/saves/control-world'))
        project.delete(layout.projectDirectory.dir('run/control/screenshots'))
    }
}

// The pipeline compiles the client of the control too, so it does not rot unseen.
var compileClientControl = tasks.register('compileClientControl', JavaCompile) {
    description = 'Compiles tools/ClientControl.java, the client of gradlew runControl.'
    source = layout.projectDirectory.dir('tools').asFileTree.matching { include 'ClientControl.java' }
    classpath = files()
    destinationDirectory = layout.buildDirectory.dir('tools')
}
tasks.named('verify') { dependsOn screenshotJar, compileClientControl }
